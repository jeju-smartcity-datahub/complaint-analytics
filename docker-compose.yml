# =============================================================================
# 제주 데이터허브 민원 분석 — 애플리케이션 스택 (백엔드 + 배치 + 프론트 + nginx)
#
# DB 는 이 파일에 없다 — 먼저 별도로 띄우고 DDL·기준데이터를 적재해 둔다 (database/ 참조).
#
# 사용법 (이 파일이 있는 루트에서):
#   cp .env.example .env          # 값 채우기 (최소 OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / 두 API 키 / DB_*)
#   docker compose up -d --build
#   docker compose ps             # 전 서비스 healthy 확인
#   open http://localhost:8080    # WEB_PORT
#   docker compose down
#
# 구성:
#   브라우저 ─▶ nginx(:WEB_PORT) ─┬─ /      ─▶ frontend:3000 (정적 SPA)
#                                └─ /api/  ─▶ backend:8070  ─▶ DB (DB_HOST:DB_PORT)
#   batch:8280 ─▶ DB,  batch ⇄ backend (INTERNAL_API_KEY / BATCH_API_KEY)
#
# DB_HOST 기본값 host.docker.internal = 이 PC(호스트)에 떠 있는 DB. 원격 DB 면 그 주소를 준다.
# 백엔드·배치는 dev 프로파일로 뜬다 (DB 접속·포트를 DB_* / SERVER_PORT 환경변수로 받는 프로파일).
# =============================================================================
name: complaint-analytics

services:
  backend:
    build: ./repos/backend
    restart: unless-stopped
    # Linux 에서도 host.docker.internal 이 호스트를 가리키게 한다 (Docker Desktop 은 기본 제공)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8070
      TZ: Asia/Seoul
      LOG_DIR: /app/logs
      # --- DB ---
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-25433}
      DB_NAME: ${DB_NAME:-jeju_datahub}
      DB_USERNAME: ${DB_USERNAME:-jeju}
      DB_PASSWORD: ${DB_PASSWORD:-jeju1234}
      # --- OIDC 로그인 (OIDC_CLIENT_ID 가 비면 기동 실패) ---
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://manager.project.dtonic.io:10443}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080}
      OIDC_END_SESSION_URI: ${OIDC_END_SESSION_URI:-https://manager.project.dtonic.io:10443/logout}
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost:8080}
      # http 로 접속하는 동안은 false 여야 세션 쿠키가 유지된다 (https 면 true)
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # --- 서비스 간 키 ---
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}        # 배치 → 백엔드 /api/internal/**
      BATCH_OPS_BASE_URL: http://batch:8280
      BATCH_OPS_API_KEY: ${BATCH_API_KEY:-}          # 백엔드 → 배치 /api/batch/** (배치와 같은 값)
      # --- 선택 기능 ---
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-}
      AGENT_ID: ${AGENT_ID:-}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      VWORLD_BASE_URL: ${VWORLD_BASE_URL:-https://api.vworld.kr}
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  batch:
    build: ./repos/batch
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8280
      TZ: Asia/Seoul
      LOG_DIR: /app/logs
      # --- DB ---
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-25433}
      DB_NAME: ${DB_NAME:-jeju_datahub}
      DB_USERNAME: ${DB_USERNAME:-jeju}
      DB_PASSWORD: ${DB_PASSWORD:-jeju1234}
      # --- 서비스 간 키 ---
      BATCH_API_AUTH_ENABLED: "true"
      BATCH_API_KEY: ${BATCH_API_KEY:-}
      BACKEND_BASE_URL: http://backend:8070
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # --- 외부 원천 (잡 실행 시 필요, 기동에는 불필요) ---
      DHUB_BASE_URL: ${DHUB_BASE_URL:-https://manager.project.dtonic.io:10443}
      DHUB_USER_EMAIL: ${DHUB_USER_EMAIL:-}
      DHUB_USER_PW: ${DHUB_USER_PW:-}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      VWORLD_BASE_URL: ${VWORLD_BASE_URL:-https://api.vworld.kr}
      # --- 스케줄 (기본 꺼짐: 원천 자격증명 없이 cron 이 돌면 실패 이력만 쌓인다) ---
      COMPLAINT_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      PBLPKLT_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      RISKNOTI_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      UTZTN_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      SFTYCHCK_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      ZONENM_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      RPTP_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
      ACDNT_SYNC_SCHEDULED: ${BATCH_SCHEDULED:-false}
    volumes:
      - batch-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8280/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./repos/frontend
      args:
        VITE_VWORLD_API_KEY: ${VITE_VWORLD_API_KEY:-}
        VITE_VWORLD_BASE_URL: ${VITE_VWORLD_BASE_URL:-}
    restart: unless-stopped
    environment:
      # 실행 시 dist/env.js 로 주입된다 (docker-entrypoint.sh) — 브라우저로 내려가므로 공개 값만
      VITE_VWORLD_API_KEY: ${VITE_VWORLD_API_KEY:-}
      VITE_VWORLD_BASE_URL: ${VITE_VWORLD_BASE_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend-logs:
  batch-logs:
