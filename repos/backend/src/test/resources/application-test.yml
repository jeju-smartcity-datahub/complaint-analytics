# =============================================================================
# test 프로파일 — ./gradlew test 전용 하네스 (TSK-4076 Step 3.5)
#
# 🔴 파일명을 application.yml / application-local.yml 로 두지 않는다.
#    테스트 클래스패스가 먼저라 메인 설정을 통째로 가려 DataSource 까지 날아간다.
# 🔴 이 파일은 OIDC discovery 를 타지 않는다 — provider 엔드포인트 4종을 직접 준다.
#    (공통 application.yml 에 discovery 키를 두지 않는 이유와 같은 문제다: YAML 빈 값이
#     null 이 아니라 "" 로 바인딩돼 프로파일로 지울 수 없다.)
# =============================================================================
spring:
  datasource:                       # local 프로파일을 안 켜므로 여기서 직접 준다
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:25432/jeju_datahub?currentSchema=parking,public
    username: jeju
    password: jeju1234
    # 나머지 3개 프로파일(-local/-dev/-prod)이 모두 명시하는 값이다. 빼면 테스트만 HikariCP 로
    # 갈려(starter-data-jpa 가 끌고 온다) 커넥션 풀 동작이 실행 환경과 달라진다.
    type: org.apache.commons.dbcp2.BasicDataSource
  security:
    oauth2:
      client:
        provider:
          dhub2:
            authorization-uri: http://localhost:1/authorize
            token-uri:         http://localhost:1/token
            user-info-uri:     http://localhost:1/userinfo
            jwk-set-uri:       http://localhost:1/jwks.json
            user-name-attribute: preferred_username
        registration:
          dhub2:
            client-id: test-client          # 비우면 `Client id must not be empty` 로 죽는다(Step 2)
            client-secret: test-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: http://localhost:5173
app:
  # TSK-4337 Step 7 — 배치 운영 프록시는 기본 미설정(명령 503 · 카탈로그 없음). 프록시 테스트가 스텁 주소로 덮는다
  batch-ops:
    base-url: ""
  auth:
    mode: mock                      # D11
    security-enabled: false         # 운영 체인 @Bean 을 끈다 (Step 3)
    end-session-endpoint: http://localhost:1/logout
    # 🔴 아래 5개는 Java 기본값(Step 4 AuthProperties)과 겹치지만 **명시한다** —
    #    이 값들이 비면 test 프로파일에서만 조용히 깨지고 원인이 안 보인다:
    #    registration-id  → OAuth2AuthenticationToken(…, registrationId) 의 Assert.hasText → 500
    #    username-claim   → DefaultOidcUser 의 nameAttributeKey → IllegalArgumentException → 500
    #    default-authrt-cd→ TB_USER.user_authrt_cd NOT NULL + FK(TB_AUTHRT) 위반 → Step 4 검증 1번 실패
    registration-id: dhub2
    username-claim: preferred_username
    role-claim: type
    default-authrt-cd: ROLE_USER    # 시드된 TB_AUTHRT 행이어야 한다(FK)
    front-base-url: http://localhost:5173
