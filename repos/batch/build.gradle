plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'jeju.datahub'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

// 백엔드 로깅 표준(Log4j2) 일치 — 기본 로깅 스타터 제외 (백엔드 build.gradle:28-31 과 동일하게 2줄)
// ⚠️ logback-classic 만 빼면 spring-boot-starter-logging 의 log4j-to-slf4j 가 남아
//    log4j-slf4j2-impl 과 순환 바인딩이 되어 기동 즉시 LoggingException
//    ("log4j-slf4j2-impl cannot be present with log4j-to-slf4j") 로 죽는다.
configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
}

// 없으면 "no repositories are defined" 로 의존성 해석 자체가 실패한다.
// eGovFrame RTE 저장소는 불필요 — 배치는 RTE 를 쓰지 않는다(D2).
repositories {
    mavenCentral()
}

// 내장 Tomcat 버전 고정 — Spring Boot 3.5.6 관리 버전(10.1.46) 대신 10.1.56 을 쓴다.
// ⚠️ Boot 를 올릴 때 이 줄을 함께 본다 — 남겨 두면 Boot 가 관리하는 더 새 Tomcat 을 막는다.
ext['tomcat.version'] = '10.1.56'

// Spring Batch 버전 고정 — Boot 3.5.6 관리 버전(5.2.3) 대신 5.2.4 를 쓴다.
// ⚠️ Boot 를 올릴 때 이 줄을 함께 본다 — 남겨 두면 Boot 가 관리하는 더 새 Spring Batch 를 막는다.
ext['spring-batch.version'] = '5.2.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'      // RestClient + 수동 트리거
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly    'org.postgresql:postgresql'
    compileOnly    'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Log4j2 플러그인(%mask 변환자, history/SecretMaskConverter) 등록용 Log4j2Plugins.dat 생성
    annotationProcessor 'org.apache.logging.log4j:log4j-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform()
    // 테스트가 띄운 Job 의 실행별 로그 파일을 작업 디렉터리 logs/ 가 아니라 build/ 아래에 둔다
    // (log4j2-spring.xml 의 sys:LOG_DIR · yml batch.ops.log-dir 의 ${LOG_DIR} 가 같은 값을 읽는다).
    systemProperty 'LOG_DIR', layout.buildDirectory.dir('test-logs').get().asFile.absolutePath
}
