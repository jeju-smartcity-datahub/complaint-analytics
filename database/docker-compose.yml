
# 제주 데이터허브 - 로컬 개발용 DB (PostgreSQL 15 / PostGIS 3.4)
#
# 사용법 (이 database/ 디렉터리에서):
#   cp .env.example .env        # 필요 시 계정/포트 수정 (비워 두면 아래 기본값)
#   docker compose up -d        # 최초 기동(빈 데이터 볼륨) 시 ddl/ 의 스키마 + 기준데이터 자동 적재
#   docker compose logs -f db   # 초기화 로그 확인 ("[init] 완료" 가 보이면 끝)
#   docker compose down         # 중지 (데이터 유지)
#   docker compose down -v   # 데이터 삭제 → 다음 up 때 DDL 재적재
#
# ⚠️ 자동 적재는 데이터 볼륨이 비어 있을 때만 실행된다. 이미 데이터가 있으면 건너뛴다.

# 같은 머신의 다른 compose 프로젝트와 섞이지 않도록 프로젝트명 고정
name: complaint-analytics-local

services:
  db:
    image: postgis/postgis:15-3.4
    # 이 태그는 linux/amd64 만 제공하므로 플랫폼을 명시한다.
    # (Apple Silicon 등 arm64 호스트에서는 Rosetta/QEMU 에뮬레이션으로 구동)
    platform: linux/amd64
    container_name: jeju-datahub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jeju_datahub}
      POSTGRES_USER: ${POSTGRES_USER:-jeju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeju1234}
      # 초기 DB 클러스터 로케일/인코딩
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-25433}:5432"
    volumes:
      # 데이터 영속화
      - pgdata:/var/lib/postgresql/data
      # 최초 초기화 스크립트 — 이미지 기본 10_postgis.sh 뒤에 돌도록 20- 접두.
      # load-data.sql 이 'data/...' 상대경로를 쓰므로 스크립트가 /ddl 로 이동해 실행한다.
      - ./init/20-load-ddl.sh:/docker-entrypoint-initdb.d/20-load-ddl.sh:ro
      - ./ddl:/ddl:ro
    healthcheck:
      # 🔴 -h 127.0.0.1 필수 — 초기화(DDL 적재) 중 임시 서버는 소켓만 연다. 소켓 기준이면
      #    적재 완료 전에 healthy 가 되어 백엔드·배치가 빈 DB 에 붙어 기동 실패한다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DDL · 격자(약 23만 행) 적재 시간을 기다린다
      start_period: 120s

volumes:
  pgdata:
    name: jeju-datahub-pgdata